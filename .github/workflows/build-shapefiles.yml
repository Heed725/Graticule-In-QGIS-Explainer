name: Build tutorial shapefiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_data.py'
      - '.github/workflows/build-shapefiles.yml'

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install shapefile dependency
        run: python -m pip install --disable-pip-version-check pyshp

      - name: Build Natural Earth and graticule shapefiles
        run: python scripts/build_data.py

      - name: Keep README filenames in sync
        shell: bash
        run: sed -i 's/naturalearth_lowres/ne_110m_admin_0_countries/g' README.md

      - name: Commit generated tutorial data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Sync Natural Earth tutorial data"
            git push
          fi
